<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>MAIPÚ LIMPIO - GPS REAL</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#16a34a">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui}
body{background:#f5f5f5}
.top{background:#16a34a;color:#fff;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;font-weight:900;position:sticky;top:0;z-index:9999}
.tabs{display:flex;gap:6px;padding:10px;background:#fff;position:sticky;top:48px;z-index:999;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.tab{flex:1;padding:12px;border-radius:10px;border:0;font-weight:800;cursor:pointer;background:#f1f5f9;font-size:14px}
.tab.active{background:#16a34a;color:#fff}
#map{height:70vh;width:100%}
#mapReclamo{height:38vh;width:100%;border-radius:12px;border:2px solid #E30613}
.card{margin:10px;background:#fff;border-radius:16px;box-shadow:0 4px 20px rgba(0,0,0,.08);padding:14px}
.badge{padding:6px 12px;border-radius:999px;font-weight:700;font-size:12px;display:inline-flex}
.badge-live{background:#dcfce7;color:#166534}.badge-warn{background:#fef3c7;color:#92400e}
.btn{padding:11px 14px;border-radius:10px;border:0;font-weight:800;cursor:pointer}
.btn-red{background:#E30613;color:#fff;width:100%}.btn-green{background:#16a34a;color:#fff;width:100%}.btn-ghost{background:#f1f5f9;color:#000;width:100%}
.btn-sm{padding:8px 10px;font-size:12px;width:auto}
input,select,textarea{width:100%;padding:11px;border-radius:10px;border:1px solid #ddd;margin:6px 0;font-size:14px}
.hidden{display:none}
</style>
</head><body>
<div class="top"><div>🚛 MAIPÚ LIMPIO - GPS REAL</div><div id="hora" style="font-size:12px">--:--</div></div>
<div class="tabs">
<button class="tab active" id="tabBtnMapa" onclick="showTab('mapa')">🛰️ En vivo REAL</button>
<button class="tab" id="tabBtnReclamos" onclick="showTab('reclamos')">📢 Reclamos</button>
</div>
<div id="tab-mapa">
<div id="map"></div>
<div class="card">
<div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px">
<span id="status" class="badge badge-live">🟢 Conectando GPS REAL...</span>
<span id="count" style="font-size:12px;font-weight:700">--</span>
</div>
<div id="lastUpdate" style="margin-top:6px;font-size:11px;color:#666"></div>
<div id="msg" style="margin-top:6px;font-size:12px;color:#666"></div>
</div>
</div>
<div id="tab-reclamos" class="hidden">
<div class="card" style="border:2px solid #E30613">
<h3>📢 Reclamo con ubicación automática</h3>
<div style="display:flex;gap:6px;margin:8px 0">
<button class="btn btn-ghost btn-sm" onclick="usarMiUbicacion()" style="flex:1">📍 Mi ubicación</button>
<button class="btn btn-ghost btn-sm" onclick="centrarMapaReclamo()" style="flex:1">🎯 Centrar</button>
</div>
<div id="mapReclamo"></div>
<div id="mapHint" style="font-size:11px;color:#E30613;font-weight:700">Tocá el mapa para fijar ubicación</div>
<input id="r_nombre" placeholder="Nombre"><input id="r_tel" placeholder="WhatsApp"><input id="r_dir" placeholder="Dirección auto"><input type="hidden" id="r_lat"><input type="hidden" id="r_lng">
<select id="r_barrio"><option>Maipú Centro</option><option>Luzuriaga</option><option>Coquimbito</option><option>Barrancas</option><option>General Gutierrez</option><option>Otro</option></select>
<select id="r_tipo"><option>No pasó el camión</option><option>Basura dispersa</option><option>Contenedor roto</option><option>Microbasural</option><option>Otro</option></select>
<textarea id="r_desc" placeholder="Descripción..."></textarea>
<button class="btn btn-red" onclick="enviarReclamo()">ENVIAR CON UBICACIÓN</button>
<div id="r_ok" style="display:none;background:#dcfce7;padding:10px;border-radius:8px;margin-top:8px;font-weight:700">✅ Enviado ID: <span id="r_id"></span></div>
</div>
<div class="card"><h4>📋 Mis reclamos</h4><div id="misReclamos"></div></div>
</div>
<script>
const MAIPU={lat:-32.985,lng:-68.78};
const sat = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:20});
const calles = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:20});
const hibrido = L.layerGroup([sat, L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:20, opacity:0.45})]);
const m = L.map('map',{center:[MAIPU.lat,MAIPU.lng],zoom:13,layers:[sat]});
L.control.layers({"🛰️ Satélite":sat,"🗺️ Calles":calles,"🌍 Híbrido":hibrido}, null, {position:'topright'}).addTo(m);

let trucks={}, mapReclamo=null, markerReclamo=null;
let firstFitDone=false;
let truckData={}; // id -> {lat,lng,targetLat,targetLng,vel}

function initReclamo(){
  if(mapReclamo) return;
  mapReclamo=L.map('mapReclamo').setView([MAIPU.lat,MAIPU.lng],14);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19}).addTo(mapReclamo);
  mapReclamo.on('click',e=>{ setReclamoMarker(e.latlng.lat, e.latlng.lng); });
}
function setReclamoMarker(lat,lng){
  if(markerReclamo) mapReclamo.removeLayer(markerReclamo);
  markerReclamo=L.marker([lat,lng],{draggable:true}).addTo(mapReclamo);
  markerReclamo.on('dragend',ev=>{ const p=ev.target.getLatLng(); aplicarUbicacion(p.lat,p.lng); });
  aplicarUbicacion(lat,lng);
}
function aplicarUbicacion(lat,lng){
  document.getElementById('r_lat').value=lat.toFixed(6);
  document.getElementById('r_lng').value=lng.toFixed(6);
  document.getElementById('r_dir').value=lat.toFixed(5)+', '+lng.toFixed(5);
  document.getElementById('mapHint').innerText=`📍 Fijada: ${lat.toFixed(5)}, ${lng.toFixed(5)}`;
  fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}&zoom=18`).then(r=>r.json()).then(d=>{ if(d.display_name){ document.getElementById('r_dir').value=d.display_name; }}).catch(()=>{});
}
function usarMiUbicacion(){
  if(!navigator.geolocation) return alert('No soporta GPS');
  document.getElementById('mapHint').innerText='📡 Buscando...';
  navigator.geolocation.getCurrentPosition(pos=>{
    const lat=pos.coords.latitude, lng=pos.coords.longitude;
    mapReclamo.setView([lat,lng],16);
    setReclamoMarker(lat,lng);
  }, err=>{ alert('Error GPS: '+err.message); }, {enableHighAccuracy:true, timeout:10000});
}
function centrarMapaReclamo(){ if(mapReclamo){ if(markerReclamo) mapReclamo.setView(markerReclamo.getLatLng(),16); else mapReclamo.setView([MAIPU.lat,MAIPU.lng],14); } }
function showTab(t){
  document.querySelectorAll('[id^="tab-"]').forEach(d=>d.classList.add('hidden'));
  document.getElementById('tab-'+t).classList.remove('hidden');
  document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));
  document.getElementById('tabBtn'+t.charAt(0).toUpperCase()+t.slice(1)).classList.add('active');
  if(t==='mapa') setTimeout(()=>m.invalidateSize(),200);
  if(t==='reclamos'){ setTimeout(()=>{initReclamo(); mapReclamo.invalidateSize();},300); renderMisReclamos(); }
}

function renderTrucks(list, meta){
  const now = Date.now();
  document.getElementById('count').innerText=`${list.length} unidades - 38 al 46 + VL176`;
  document.getElementById('lastUpdate').innerText=`Último GPS REAL: ${meta?.last_update? new Date(meta.last_update).toLocaleString('es-AR') : 'desconocido'} - data companyId 66`;
  
  if(meta?.last_update){
    const diffMin = (now - new Date(meta.last_update).getTime())/1000/60;
    if(diffMin > 12){
      document.getElementById('status').className='badge badge-warn';
      document.getElementById('status').innerText=`⚠️ Sin actualización hace ${Math.round(diffMin)} min`;
      document.getElementById('msg').innerText=`El bot cada 2 min no pudo leer posiciones nuevas de rastreo.idecgps.com.ar. Revisá Actions > último Success. Si sigue fallando, es porque IDECGPS necesita login con token (no basic auth).`;
    } else {
      document.getElementById('status').className='badge badge-live';
      document.getElementById('status').innerText=`🟢 GPS REAL - ${list.length} camiones - hace ${Math.round(diffMin)} min`;
      document.getElementById('msg').innerText=`Actualizado hace ${Math.round(diffMin)} min desde IDECGPS companyId 66. Movimiento suave interpolado, no va y viene.`;
    }
  }

  list.forEach(v=>{
    // Si ya existe, poner target nuevo, no saltar directo
    if(!truckData[v.id]){
      truckData[v.id]={lat:v.lat,lng:v.lng,targetLat:v.lat,targetLng:v.lng,vel:v.vel||0};
    } else {
      // solo actualizar target si realmente cambió
      if(Math.abs(truckData[v.id].targetLat - v.lat) > 0.000001 || Math.abs(truckData[v.id].targetLng - v.lng) > 0.000001){
        truckData[v.id].targetLat=v.lat;
        truckData[v.id].targetLng=v.lng;
      }
      truckData[v.id].vel=v.vel||0;
    }
    truckData[v.id].alias=v.alias||v.id;
    truckData[v.id].estado=v.estado||'';

    const detenido=(v.vel||0)==0;
    const color=detenido?'#f59e0b':'#16a34a';
    const icon=L.divIcon({html:`<div style="background:${color};color:#fff;padding:3px 7px;border-radius:20px;font-weight:800;font-size:10px;border:1.5px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.35);white-space:nowrap;line-height:1.1">${detenido?'🅿️':'🚛'} ${v.alias||v.id} <span style="font-weight:400">${v.vel}km/h</span></div>`,className:'',iconSize:[68,22]});
    
    if(!trucks[v.id]){
      const mk=L.marker([v.lat,v.lng],{icon}).addTo(m).bindPopup(`<b>${v.alias||v.id} - ${v.estado}</b><br>${v.vel} km/h`);
      trucks[v.id]=mk;
    } else {
      trucks[v.id].setIcon(icon);
      trucks[v.id].setPopupContent(`<b>${v.alias||v.id} - ${v.estado}</b><br>${v.vel} km/h<br>${v.lat.toFixed(5)}, ${v.lng.toFixed(5)}`);
    }
  });

  Object.keys(trucks).forEach(id=>{
    if(!list.find(v=>v.id===id)){
      m.removeLayer(trucks[id]);
      delete trucks[id];
      delete truckData[id];
    }
  });

  if(!firstFitDone && list.length>0){
    try{
      const group = new L.featureGroup(Object.values(trucks));
      m.fitBounds(group.getBounds().pad(0.3));
      firstFitDone=true;
    }catch(e){}
  }
}

// Animación suave real - interpola entre posición actual y target
function animate(){
  Object.keys(truckData).forEach(id=>{
    const d=truckData[id];
    const mk=trucks[id];
    if(!mk) return;
    // interpolación lineal 0.02 = suave, avanza hacia target
    const latDiff = d.targetLat - d.lat;
    const lngDiff = d.targetLng - d.lng;
    const dist = Math.sqrt(latDiff*latDiff + lngDiff*lngDiff);
    if(dist > 0.0000005){
      // velocidad de interpolación: si está detenido, más lento; si va rápido, más rápido
      const speed = d.vel > 10 ? 0.08 : d.vel > 2 ? 0.04 : 0.015;
      d.lat += latDiff * speed;
      d.lng += lngDiff * speed;
      mk.setLatLng([d.lat, d.lng]);
    }
  });
  requestAnimationFrame(animate);
}
animate();

async function fetchVehicles(){
  try{
    const r=await fetch('vehicles.json?v='+Date.now(),{cache:'no-store'});
    if(r.ok){ return await r.json(); }
  }catch(e){ console.error(e); }
  return {vehicles:[], count:0};
}
async function loadMapa(){ 
  const data=await fetchVehicles(); 
  if(data.vehicles) renderTrucks(data.vehicles, data); 
}
setInterval(()=>{ document.getElementById('hora').innerText=new Date().toLocaleTimeString('es-AR',{timeZone:'America/Argentina/Mendoza'}); },1000);
loadMapa(); 
setInterval(loadMapa, 15000);

function getReclamos(){ return JSON.parse(localStorage.getItem('maipu_reclamos')||'[]'); }
function saveReclamos(l){ localStorage.setItem('maipu_reclamos', JSON.stringify(l)); }
function enviarReclamo(){
  const nombre=document.getElementById('r_nombre').value, tel=document.getElementById('r_tel').value, dir=document.getElementById('r_dir').value, barrio=document.getElementById('r_barrio').value, tipo=document.getElementById('r_tipo').value, desc=document.getElementById('r_desc').value, lat=document.getElementById('r_lat').value, lng=document.getElementById('r_lng').value;
  if(!dir||!desc||!lat||!lng){ alert('Fijá ubicación tocando mapa o 📍 Mi ubicación'); return; }
  const lista=getReclamos();
  const id='ML-'+Date.now().toString().slice(-6);
  lista.unshift({id,nombre,tel,dir,barrio,tipo,desc,lat:parseFloat(lat),lng:parseFloat(lng),fecha:new Date().toLocaleString('es-AR'),estado:'Pendiente'});
  saveReclamos(lista);
  document.getElementById('r_id').innerText=id; document.getElementById('r_ok').style.display='block';
  renderMisReclamos();
}
function renderMisReclamos(){
  const lista=getReclamos(); const div=document.getElementById('misReclamos');
  if(lista.length===0){ div.innerHTML='<p style="color:#888;font-size:12px">Sin reclamos</p>'; return; }
  div.innerHTML=lista.map(r=>`<div style="border:1px solid #eee;border-radius:10px;padding:10px;margin:6px 0"><b>${r.id}</b> - ${r.estado}<br>${r.tipo} - ${r.dir}<br><small>${r.fecha}</small><br><a href="https://www.google.com/maps/dir/?api=1&destination=${r.lat},${r.lng}" target="_blank" style="color:#E30613;font-weight:800">📍 Ver en Maps</a></div>`).join('');
}
</script>
</body></html>
