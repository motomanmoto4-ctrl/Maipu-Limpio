name: GPS REAL Maipu V5 SAN FRANCISCO REAL
on:
  schedule:
    - cron: '*/2 * * * *'
  workflow_dispatch:
jobs:
  sync-gps:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install playwright requests
      - run: playwright install --with-deps chromium
      - name: Sacar GPS REAL
        env:
          IDEC_USER: recoleccion
          IDEC_PASS: maipu
        run: |
          python << 'PY'
          import json, re, time, os, datetime
          from playwright.sync_api import sync_playwright

          USER=os.getenv("IDEC_USER"); PASS=os.getenv("IDEC_PASS")
          BASE="https://rastreo.idecgps.com.ar/streetz/"
          vehicles=[]

          with sync_playwright() as p:
              browser=p.chromium.launch(headless=True)
              page=browser.new_page()
              logs=[]

              # Capturar TODO lo que venga de IDEC
              def on_resp(r):
                  try:
                      url=r.url
                      if "rastreo.idecgps" in url and r.status==200:
                          ct=r.headers.get("content-type","")
                          if "json" in ct or "api" in url.lower():
                              txt=r.text()
                              if len(txt)>50 and ("lat" in txt.lower() or "companyid" in txt.lower() or "label" in txt.lower()):
                                  print(f"JSON {url} => {txt[:1500]}")
                                  logs.append((url,txt))
                  except: pass
              page.on("response", on_resp)

              ws_logs=[]
              def on_ws(ws):
                  def on_msg(m):
                      s=str(m)
                      if len(s)>30 and ("lat" in s.lower() or "company" in s.lower() or "cc-" in s.lower() or "41" in s):
                          print(f"WS {s[:1500]}")
                          ws_logs.append(s)
                  ws.on("framereceived", on_msg)
              page.on("websocket", on_ws)

              page.goto(BASE, wait_until="domcontentloaded")
              time.sleep(5)
              # Login real StreetZ
              try:
                  page.get_by_placeholder("Usuario").fill(USER)
              except:
                  try: page.locator('input[type="text"]').first.fill(USER)
                  except: pass
              try:
                  page.get_by_placeholder("Contraseña").fill(PASS)
              except:
                  try: page.locator('input[type="password"]').fill(PASS)
                  except: pass
              time.sleep(1)
              try:
                  page.get_by_role("button", name="Ingresar").click()
              except:
                  try: page.locator('button[type="submit"]').click()
                  except: page.keyboard.press("Enter")
              print("Login enviado, esperando 25s mapa")
              time.sleep(25)

              # Ahora pedir posiciones via JS usando el mismo fetch que usa la pagina
              try:
                  data = page.evaluate("""async () => {
                      let out = [];
                      // intentar llamar a los endpoints que usa StreetZ internamente
                      const tries = [
                          '/streetz/api/getVehicles',
                          '/streetz/api/vehicles',
                          '/streetz/api/Vehicle/GetAll',
                          '/streetz/api/posiciones',
                          '/streetz/api/units',
                      ];
                      for (let ep of tries) {
                          try {
                              let r = await fetch(ep, {credentials:'include'});
                              let t = await r.text();
                              if (t && t.length>100) out.push(ep+':'+t.substring(0,8000));
                          } catch(e){}
                      }
                      // tambien buscar en window
                      try {
                          for (let k in window) {
                              try {
                                  let v = window[k];
                                  if (v && typeof v==='object') {
                                      let s = JSON.stringify(v);
                                      if (s && s.length>100 && s.length<20000 && (s.includes('CC-') || s.includes('companyId'))) out.push(k+':'+s.substring(0,8000));
                                  }
                              } catch(e){}
                          }
                      } catch(e){}
                      return out.join('\\n---\\n');
                  }""")
                  print(f"EVAL {data[:8000]}")
                  logs.append(("eval", data))
              except Exception as e:
                  print(f"eval err {e}")

              time.sleep(5)
              browser.close()

              # Parsear todo lo capturado
              blob = "\n".join([t for u,t in logs] + ws_logs)
              # Buscar JSON array con companyId 66
              for url,txt in logs:
                  try:
                      j=json.loads(txt.split(':',1)[-1] if ':' in txt[:100] else txt)
                      lst=None
                      if isinstance(j, dict) and "data" in j: lst=j["data"]
                      elif isinstance(j, list): lst=j
                      elif isinstance(j, dict) and "vehicles" in j: lst=j["vehicles"]
                      if not lst: continue
                      print(f"Lista {len(lst)} en {url}")
                      for it in lst:
                          if not isinstance(it, dict): continue
                          label=str(it.get("label") or it.get("name") or it.get("alias") or "")
                          vid=None
                          m=re.search(r'\b(3[8-9]|4[0-6])\b', label)
                          if m: vid=m.group(1)
                          elif "176" in label or "VL" in label.upper(): vid="VL176"
                          if not vid: continue
                          lat=it.get("lat") or it.get("latitude") or (it.get("position") or {}).get("lat")
                          lng=it.get("lng") or it.get("lon") or (it.get("position") or {}).get("lng")
                          if lat and lng:
                              try:
                                  vehicles.append({"id":vid,"alias":f"CC-{vid}" if vid!="VL176" else "VL-176","lat":float(lat),"lng":float(lng),"vel":int(float(it.get("speed") or it.get("vel") or 0)),"estado":"EN MOVIMIENTO" if float(it.get("speed") or 0)>2 else "DETENIDO","zona":"Maipu","en_servicio":True})
                              except: pass
                  except: pass

          if not vehicles:
              print("NO SALIO REAL - usando cache pero marcando FALLO")
              try:
                  with open("vehicles.json","r") as f:
                      old=json.load(f)
                      vehicles=old.get("vehicles",[])
              except: pass

          uniq={v["id"]:v for v in vehicles}
          vehicles=list(uniq.values())
          out={
              "count":len(vehicles),
              "last_update":datetime.datetime.now(datetime.timezone.utc).isoformat(),
              "status":f"EN SERVICIO - {len(vehicles)} camiones - San Francisco Monte - {datetime.datetime.now(datetime.timezone.utc).strftime('%H:%M UTC')}",
              "source":f"playwright V5 - companyId 66 - {USER}",
              "vehicles":vehicles,
              "debug_blob": blob[:10000]
          }
          with open("vehicles.json","w",encoding="utf-8") as f:
              json.dump(out,f,indent=2,ensure_ascii=False)
          print(f"FINAL {len(vehicles)} camiones")
          PY
      - name: Commit
        run: |
          git config user.name "GPS REAL V5"
          git config user.email "gps@maipu.gob.ar"
          git add vehicles.json
          git diff --staged --quiet || (git commit -m "GPS V5 REAL $(date -u +%H:%M)" && git push)
