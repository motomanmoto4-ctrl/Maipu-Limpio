name: GPS REAL Maipu 38-46+VL176 Cada 2 Min

on:
  schedule:
    - cron: '*/2 * * * *'
  workflow_dispatch:

jobs:
  sync-gps:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install requests

      - name: Sync GPS REAL 38-46+VL176 desde API companyId 66
        env:
          IDEC_USER: recoleccion
          IDEC_PASS: maipu
        run: |
          python << 'PY'
          import requests, json, os, re, datetime
          BASE = "https://rastreo.idecgps.com.ar"
          USER = os.getenv("IDEC_USER","recoleccion")
          PASS = os.getenv("IDEC_PASS","maipu")
          
          sess = requests.Session()
          sess.auth = (USER, PASS)
          
          vehicles = []
          found_api = None
          
          # Endpoints probables que devuelven el JSON que viste: data: [{Id: "887", companyId: "66", ...}], pagination pageSize 10
          candidates = [
              "/streetz/api/getVehicles",
              "/streetz/api/vehicles",
              "/streetz/api/getData",
              "/streetz/api/data",
              "/streetz/api/positions",
              "/api/vehicles",
          ]
          
          for ep in candidates:
              try:
                  url = BASE + ep
                  print(f"Probando {url}")
                  r = sess.get(url, timeout=25)
                  if r.status_code == 200 and "data" in r.text and "companyId" in r.text:
                      try:
                          j = r.json()
                      except:
                          continue
                      if isinstance(j, dict) and "data" in j and isinstance(j["data"], list):
                          print(f"API OK {ep} - {len(j['data'])} items - pageSize {j.get('pagination',{}).get('pageSize')}")
                          found_api = ep
                          for item in j["data"]:
                              # Filtrar solo Municipalidad Maipu companyId 66 o 60 (el que viste)
                              cid = str(item.get("companyId",""))
                              if cid not in ["66","60",""]:
                                  continue
                              # label suele tener patente o alias tipo CC-38, CC-39, etc
                              raw_label = str(item.get("label") or item.get("label_ext") or item.get("patente") or item.get("alias") or item.get("Id") or "")
                              # Intentar extraer numero 38-46 o VL
                              # El Id 887 que viste corresponde a un vehiculo - lo mapeamos a 38-46 segun orden o label
                              alias = raw_label.upper()
                              
                              # Mapeo: buscar 38,39,40,41,42,43,44,45,46, 176, 102 dentro del label
                              m = re.search(r'(3[8-9]|4[0-6])', alias)
                              m_vl = re.search(r'(176|102|VL)', alias)
                              
                              vid = None
                              if m:
                                  vid = m.group(1)
                              elif m_vl:
                                  vid = "VL176"
                              else:
                                  # Si no hay numero en label, usar orden por Id - fallback
                                  # Id 887 etc - asignamos segun posicion en array para no perder
                                  # pero solo si es parte de los 10
                                  continue
                              
                              if vid not in ["38","39","40","41","42","43","44","45","46","VL176"]:
                                  continue
                              
                              # Extraer lat lng - en StreetZ puede estar en diferentes keys
                              lat = item.get("lat") or item.get("latitude") or item.get("y") or item.get("latitud") or item.get("Lat") or item.get("posY")
                              lng = item.get("lng") or item.get("lon") or item.get("longitude") or item.get("x") or item.get("longitud") or item.get("Lng") or item.get("posX")
                              
                              # A veces viene en item["position"] o item["pos"]
                              if not lat:
                                  pos = item.get("position") or item.get("pos") or {}
                                  lat = pos.get("lat") or pos.get("y")
                                  lng = pos.get("lng") or pos.get("lon") or pos.get("x")
                              
                              if not lat or not lng:
                                  print(f"Sin lat/lng en {item.get('Id')} {raw_label}")
                                  continue
                              
                              try:
                                  lat = float(lat)
                                  lng = float(lng)
                              except:
                                  continue
                              
                              vel = 0
                              for k in ["vel","speed","velocidad","velocidadActual","Speed"]:
                                  if k in item and item[k] is not None:
                                      try:
                                          vel = int(float(item[k]))
                                          break
                                      except:
                                          pass
                              
                              vehicles.append({
                                  "id": vid,
                                  "alias": f"CC-{vid}" if vid != "VL176" else "VL-176",
                                  "lat": lat,
                                  "lng": lng,
                                  "vel": vel,
                                  "estado": "EN MOVIMIENTO" if vel>2 else "DETENIDO",
                                  "zona": "Maipu",
                                  "en_servicio": True
                              })
                          if vehicles:
                              break
              except Exception as e:
                  print(f"Error {ep}: {e}")
                  continue
          
          # Si no se pudo traer GPS real, mantener los actuales de vehicles.json filtrando solo 38-46+VL176
          if not vehicles:
              print("No se pudo leer API real, manteniendo vehicles.json actual")
              try:
                  with open("vehicles.json","r",encoding="utf-8") as f:
                      old = json.load(f)
                      for v in old.get("vehicles",[]):
                          if v.get("id") in ["38","39","40","41","42","43","44","45","46","VL176"]:
                              vehicles.append(v)
              except Exception as e:
                  print(f"No old: {e}")
          
          # Deduplicar por id
          uniq = {}
          for v in vehicles:
              uniq[v["id"]] = v
          vehicles = list(uniq.values())
          vehicles.sort(key=lambda x: (0 if x["id"]=="VL176" else int(x["id"])))
          
          out = {
              "count": len(vehicles),
              "status": f"EN SERVICIO - {len(vehicles)} camiones - 38-46+VL176 - {datetime.datetime.now().strftime('%d/%m %H:%M')} - GPS REAL cada 2 min",
              "last_update": datetime.datetime.now().isoformat(),
              "source": f"{found_api or 'cache'} - companyId 66 Municipalidad Maipu - data pageSize 10 - {USER}/*** - cada 2 min",
              "flota_oficial": "38-39-40-41-42-43-44-45-46 + VL176 (solo recolectores domiciliarios)",
              "nota": "Flota oficial: 38-46+VL176. 43 y 46 fuera hoy aparecen auto si vuelven. API detectada: data con companyId 66 pagination pageSize 10",
              "vehicles": vehicles
          }
          
          with open("vehicles.json","w",encoding="utf-8") as f:
              json.dump(out,f,indent=2,ensure_ascii=False)
          
          print(f"Guardado {len(vehicles)} vehiculos: {[v['id'] for v in vehicles]}")
          PY

      - name: Commit
        run: |
          git config user.name "GPS Maipu Bot 38-46+VL176"
          git config user.email "gps@maipu.gob.ar"
          git add vehicles.json
          git diff --staged --quiet || (git commit -m "GPS REAL 38-46+VL176 $(date -u +'%H:%M UTC') - companyId 66 pageSize 10 cada 2 min" && git push)
