name: GPS REAL Maipu V8 IP
on:
  schedule:
    - cron: '*/2 * * * *'
  workflow_dispatch:
jobs:
  sync-gps:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Playwright
        run: |
          pip install playwright
          playwright install --with-deps chromium
      - name: GPS REAL desde 190.111.129.5
        env:
          IDEC_USER: recoleccion
          IDEC_PASS: maipu
        run: |
          python << 'PY'
          import json, re, time, os, datetime, traceback
          from playwright.sync_api import sync_playwright
          USER=os.getenv("IDEC_USER")
          PASS=os.getenv("IDEC_PASS")
          vehicles=[]
          debug_log=[]
          try:
            with sync_playwright() as p:
              browser=p.chromium.launch(headless=True, args=["--ignore-certificate-errors"])
              page=browser.new_page()
              page.set_default_timeout(30000)
              captured=[]
              def on_resp(resp):
                try:
                  if "190.111.129.5" in resp.url and resp.status==200:
                    t=resp.text()
                    if len(t)>100 and ("lat" in t.lower() or "CC-" in t or "company" in t.lower()):
                      print(f"CAPTURA {resp.url[:100]} len {len(t)}")
                      captured.append(t[:20000])
                except: pass
              page.on("response", on_resp)
              print("GOTO http://190.111.129.5/mini/login.html")
              page.goto("http://190.111.129.5/mini/login.html", wait_until="domcontentloaded", timeout=40000)
              time.sleep(6)
              try:
                page.locator('input[type="text"]').first.fill(USER)
                page.locator('input[type="password"]').first.fill(PASS)
                page.locator('button, input[type="submit"], button:has-text("Ingresar")').first.click()
                print("LOGIN OK")
              except Exception as e:
                debug_log.append(f"login err {e}")
              time.sleep(18)
              try:
                html=page.content()
                captured.append(html[:20000])
                print(f"HTML final len {len(html)}")
              except Exception as e:
                debug_log.append(str(e))
              browser.close()
            # parsear todo lo capturado
            blob="\n".join(captured)
            print(f"BLOB total {len(blob)}")
            # buscar JSON
            for txt in captured:
              try:
                # intentar JSON directo
                data_list=None
                try:
                  j=json.loads(txt)
                  if isinstance(j, dict) and "data" in j:
                    data_list=j["data"]
                  elif isinstance(j, list):
                    data_list=j
                except:
                  # buscar array dentro del texto
                  m=re.search(r'\[.*?"lat".*?\]', txt, re.DOTALL|re.IGNORECASE)
                  if m:
                    try:
                      data_list=json.loads(m.group(0))
                    except:
                      pass
                if not data_list:
                  continue
                print(f"Lista encontrada {len(data_list)}")
                for it in data_list:
                  if not isinstance(it, dict): continue
                  label=str(it.get("label") or it.get("name") or it.get("alias") or it.get("patente") or "")
                  vid=None
                  mm=re.search(r'\b(3[8-9]|4[0-6])\b', label)
                  if mm: vid=mm.group(1)
                  elif "176" in label or "102" in label: vid="VL176"
                  if not vid: continue
                  lat=it.get("lat") or it.get("latitude")
                  lng=it.get("lng") or it.get("lon") or it.get("longitude")
                  if not lat or not lng: 
                    pos=it.get("position") or {}
                    lat=pos.get("lat"); lng=pos.get("lng") or pos.get("lon")
                  if lat and lng:
                    vehicles.append({"id":vid,"alias":f"CC-{vid}" if vid!="VL176" else "VL-176","lat":float(lat),"lng":float(lng),"vel":int(float(it.get("speed") or it.get("vel") or 0)),"estado":"EN MOVIMIENTO","zona":"Maipu","en_servicio":True})
              except Exception as e:
                print(f"parse err {e}")
          except Exception as e:
            debug_log.append(traceback.format_exc())
            print(f"ERROR {e}")

          if not vehicles:
            try:
              with open("vehicles.json","r",encoding="utf-8") as f:
                old=json.load(f)
                vehicles=old.get("vehicles",[])
                print(f"Usando cache viejo {len(vehicles)}")
            except: pass

          uniq={str(v["id"]):v for v in vehicles}
          vehicles=list(uniq.values())
          out={
            "count":len(vehicles),
            "last_update":datetime.datetime.now(datetime.timezone.utc).isoformat(),
            "status":f"GPS REAL V8 IP - {len(vehicles)} camiones - {datetime.datetime.now(datetime.timezone.utc).strftime('%H:%M UTC')}",
            "source":"190.111.129.5/mini/login.html - companyId 66 - V8",
            "debug":"\n".join(debug_log)[:7000],
            "vehicles":vehicles
          }
          with open("vehicles.json","w",encoding="utf-8") as f:
            json.dump(out,f,indent=2,ensure_ascii=False)
          print(f"GUARDADO FINAL {len(vehicles)}")
          PY
      - name: Commit siempre aunque falle
        if: always()
        run: |
          git config user.name "GPS V8"
          git config user.email "gps@maipu.gob.ar"
          git add vehicles.json
          git diff --staged --quiet || (git commit -m "GPS V8 IP $(date -u +%H:%M)" && git push)
